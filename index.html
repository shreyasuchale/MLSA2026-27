<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand">
          <h1>Productivity Timer</h1>
          <p>Pomodoro timer with work/break cycles</p>
        </div>
        <div class="session-type" id="sessionType">Work</div>
      </header>

      <main>
        <section class="timer-card">
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="controls">
            <button id="startBtn" class="btn primary">Start</button>
            <button id="pauseBtn" class="btn secondary">Pause</button>
            <button id="resetBtn" class="btn secondary">Reset</button>
          </div>
        </section>

        <section class="status-panel">
          <div class="status-item">
            <span>Session</span>
            <strong id="sessionCounter">0 / 4</strong>
          </div>
          <div class="status-item">
            <span>Message</span>
            <strong id="messageText">Let's get focused!</strong>
          </div>
        </section>

        <section class="settings-card">
          <h2>Customize durations</h2>
          <form id="settingsForm">
            <label>
              Work (minutes)
              <input type="number" id="workDuration" min="1" value="25" />
            </label>
            <label>
              Short Break (minutes)
              <input type="number" id="shortBreakDuration" min="1" value="5" />
            </label>
            <label>
              Long Break (minutes)
              <input type="number" id="longBreakDuration" min="1" value="15" />
            </label>
            <button type="submit" class="btn primary">Save Settings</button>
          </form>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
